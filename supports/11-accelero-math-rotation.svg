<svg width="900" height="1000" xmlns="http://www.w3.org/2000/svg">
  <style>
    .axis { stroke: #333; stroke-width: 2; }
    .axis-rot { stroke: #d946ef; stroke-width: 2; stroke-dasharray: 5; }
    .vector-grav { stroke: #f59e0b; stroke-width: 3; marker-end: url(#arrow-grav); }
    .vector-acc { stroke: #8b5cf6; stroke-width: 3; marker-end: url(#arrow-acc); }
    .label { font-family: Arial, sans-serif; font-size: 13px; fill: #333; }
    .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #111; }
    .axis-label { font-family: Arial, sans-serif; font-size: 13px; fill: #555; font-weight: bold; }
    .legend-box { fill: #fff; stroke: #ccc; stroke-width: 1; }
    .circle-rot { fill: none; stroke: #d946ef; stroke-width: 2; }
  </style>

  <defs>
    <marker id="arrow-grav" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f59e0b" />
    </marker>
    <marker id="arrow-acc" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8b5cf6" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f9fafb" />
  <text x="450" y="30" text-anchor="middle" class="title">Composantes de Rotation (Roll, Pitch, Yaw) &amp; Gravité</text>

  <!-- SCÈNE 1 : Repère de base et définition des axes de rotation -->
  <g transform="translate(200, 150)">
    <text x="0" y="-20" text-anchor="middle" class="title">1. Axes de Rotation</text>
    
    <!-- Repère 3D -->
    <line x1="0" y1="0" x2="-80" y2="40" stroke="#333" stroke-width="2" /> <!-- X -->
    <line x1="0" y1="0" x2="80" y2="40" stroke="#333" stroke-width="2" /> <!-- Y -->
    <line x1="0" y1="0" x2="0" y2="-100" stroke="#333" stroke-width="2" /> <!-- Z -->
    
    <text x="-90" y="50" class="axis-label">X (Roll)</text>
    <text x="90" y="50" class="axis-label">Y (Pitch)</text>
    <text x="10" y="-110" class="axis-label">Z (Yaw)</text>

    <!-- Flèches de rotation circulaires -->
    <!-- Roll autour de X -->
    <path d="M -40,-40 A 50 50 0 0 1 40,-40" fill="none" stroke="#d946ef" stroke-width="2" marker-end="url(#arrow-rot)" />
    <text x="0" y="-70" text-anchor="middle" fill="#d946ef" font-weight="bold">Roll</text>
    
    <!-- Pitch autour de Y (perspective simplifiée) -->
    <ellipse cx="0" cy="0" rx="30" ry="60" fill="none" stroke="#d946ef" stroke-width="2" stroke-dasharray="4"/>
    <text x="40" y="0" fill="#d946ef" font-weight="bold">Pitch</text>

    <!-- Yaw autour de Z -->
    <circle cx="0" cy="-80" r="20" fill="none" stroke="#d946ef" stroke-width="2" stroke-dasharray="4"/>
    <text x="30" y="-80" fill="#d946ef" font-weight="bold">Yaw</text>
  </g>

  <!-- SCÈNE 2 : Projection de la Gravité (Fonctionnement de l'accéléromètre) -->
  <g transform="translate(650, 150)">
    <text x="0" y="-20" text-anchor="middle" class="title">2. Gravité et Inclinaison</text>
    <text x="0" y="0" text-anchor="middle" font-size="11px" fill="#666">(L'accéléromètre voit la gravité)</text>

    <!-- Objet incliné -->
    <rect x="-40" y="-40" width="80" height="80" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2" transform="rotate(20)" />
    
    <!-- Repère lié à l'objet (tourné) -->
    <line x1="0" y1="0" x2="-60" y2="20" stroke="#4f46e5" stroke-width="2" /> <!-- X' -->
    <line x1="0" y1="0" x2="60" y2="20" stroke="#4f46e5" stroke-width="2" /> <!-- Y' -->
    <line x1="0" y1="0" x2="0" y2="-80" stroke="#4f46e5" stroke-width="2" /> <!-- Z' -->
    
    <text x="-70" y="30" fill="#4f46e5" font-size="12px">X'</text>
    <text x="70" y="30" fill="#4f46e5" font-size="12px">Y'</text>
    <text x="10" y="-90" fill="#4f46e5" font-size="12px">Z'</text>

    <!-- Vecteur Gravité (Toujours vers le bas réel) -->
    <line x1="0" y1="0" x2="0" y2="90" class="vector-grav" />
    <text x="10" y="100" fill="#f59e0b" font-weight="bold">Gravité (1g)</text>

    <!-- Composantes projetées -->
    <line x1="0" y1="0" x2="30" y2="85" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3" />
    <line x1="30" y1="85" x2="0" y2="85" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3" />
    <text x="40" y="60" font-size="11px" fill="#f59e0b">Proj. Y'</text>
    <text x="-40" y="80" font-size="11px" fill="#f59e0b">Proj. Z'</text>
  </g>

  <!-- TABLEAU RÉCAPITULATIF -->
  <g transform="translate(100, 400)">
    <rect x="0" y="0" width="700" height="220" class="legend-box" rx="5" />
    <text x="20" y="30" class="title">Récapitulatif des Capteurs</text>
    
    <!-- En-têtes -->
    <text x="20" y="60" font-weight="bold" font-size="13px">Mouvement</text>
    <text x="150" y="60" font-weight="bold" font-size="13px">Axe</text>
    <text x="250" y="60" font-weight="bold" font-size="13px">Capteur Principal</text>
    <text x="450" y="60" font-weight="bold" font-size="13px">Principe Physique</text>

    <!-- Ligne 1 -->
    <line x1="20" y1="70" x2="680" y2="70" stroke="#eee" />
    <text x="20" y="95" font-size="13px">Roll (Roulis)</text>
    <text x="150" y="95" font-size="13px" fill="#d946ef">X</text>
    <text x="250" y="95" font-size="13px">Accéléromètre + Gyro</text>
    <text x="450" y="95" font-size="13px" fill="#555">Projection de la gravité sur Y et Z</text>

    <!-- Ligne 2 -->
    <line x1="20" y1="105" x2="680" y2="105" stroke="#eee" />
    <text x="20" y="130" font-size="13px">Pitch (Tangage)</text>
    <text x="150" y="130" font-size="13px" fill="#d946ef">Y</text>
    <text x="250" y="130" font-size="13px">Accéléromètre + Gyro</text>
    <text x="450" y="130" font-size="13px" fill="#555">Projection de la gravité sur X et Z</text>

    <!-- Ligne 3 -->
    <line x1="20" y1="140" x2="680" y2="140" stroke="#eee" />
    <text x="20" y="165" font-size="13px">Yaw (Lacet)</text>
    <text x="150" y="165" font-size="13px" fill="#d946ef">Z</text>
    <text x="250" y="165" font-size="13px" font-weight="bold" fill="#dc2626">Gyroscope (ou Boussole)</text>
    <text x="450" y="165" font-size="13px" fill="#555">Vitesse angulaire (la gravité ne change rien)</text>

    <!-- Note importante -->
    <rect x="20" y="180" width="660" height="30" fill="#fff7ed" stroke="#fed7aa" rx="3" />
    <text x="30" y="200" font-size="12px" fill="#c2410c">
      Note : L'accéléromètre seul ne peut pas distinguer une accélération linéaire d'une inclinaison (problème de découplage). 
    </text>
    <text x="30" y="215" font-size="12px" fill="#c2410c">
      C'est pourquoi on utilise un "Filtre Complémentaire" ou un "Filtre de Kalman" pour fusionner les données Gyro + Accéléro.
    </text>
  </g>

  <!-- SCHÉMA FUSION DE CAPTEURS -->
  <g transform="translate(250, 660)">
    <text x="200" y="-20" text-anchor="middle" class="title">3. Fusion de Capteurs (Sensor Fusion)</text>
    
    <!-- Boites -->
    <rect x="0" y="0" width="100" height="60" fill="#dbeafe" stroke="#2563eb" rx="5" />
    <text x="50" y="35" text-anchor="middle" font-size="12px" font-weight="bold">Accéléro</text>
    <text x="50" y="50" text-anchor="middle" font-size="10px">(Bon statique)</text>

    <rect x="300" y="0" width="100" height="60" fill="#fce7f3" stroke="#db2777" rx="5" />
    <text x="350" y="35" text-anchor="middle" font-size="12px" font-weight="bold">Gyroscope</text>
    <text x="350" y="50" text-anchor="middle" font-size="10px">(Bon dynamique)</text>

    <!-- Flèches vers fusion -->
    <line x1="100" y1="30" x2="180" y2="30" stroke="#333" stroke-width="2" marker-end="url(#arrow-acc)" />
    <line x1="300" y1="30" x2="220" y2="30" stroke="#333" stroke-width="2" marker-end="url(#arrow-acc)" />

    <!-- Boite Fusion -->
    <rect x="180" y="0" width="40" height="60" fill="#dcfce7" stroke="#16a34a" rx="5" />
    <text x="200" y="25" text-anchor="middle" font-size="10px" font-weight="bold">Filtre</text>
    <text x="200" y="40" text-anchor="middle" font-size="10px">de</text>
    <text x="200" y="55" text-anchor="middle" font-size="10px" font-weight="bold">Kalman</text>

    <!-- Résultat -->
    <line x1="220" y1="30" x2="260" y2="30" stroke="#333" stroke-width="2" marker-end="url(#arrow-acc)" />
    <rect x="260" y="-10" width="120" height="80" fill="#fff" stroke="#333" stroke-width="2" rx="5" />
    <text x="320" y="15" text-anchor="middle" font-size="12px" font-weight="bold">Orientation</text>
    <text x="320" y="35" text-anchor="middle" font-size="11px">Roll, Pitch, Yaw</text>
    <text x="320" y="55" text-anchor="middle" font-size="11px" fill="#16a34a">Précis &amp; Stable</text>
  </g>
</svg>